<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Temio_Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Primary Meta -->
    <title>Temio · 脑力训练</title>
    <meta name="description" content="Temio 是脑力与认知训练平台，提供 Stroop 测试、舒尔特方格等科学训练项目，每日几分钟提升专注力、反应力与记忆。" />
    <meta name="keywords" content="脑力训练,认知训练,Stroop,舒尔特方格,注意力,反应力,Temio" />
    <meta name="author" content="Temio" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Temio" />
    <meta property="og:title" content="Temio · 脑力训练" />
    <meta property="og:description" content="Temio 是脑力与认知训练平台，提供 Stroop 测试、舒尔特方格等科学训练项目，每日几分钟提升专注力、反应力与记忆。" />
    <meta property="og:locale" content="zh_CN" />
    <!-- og:url 由各页面或运行时设置；部署时可用 VITE_SITE_BASE_URL -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Temio · 脑力训练" />
    <meta name="twitter:description" content="Temio 是脑力与认知训练平台，提供 Stroop 测试、舒尔特方格等科学训练项目，每日几分钟提升专注力、反应力与记忆。" />

    <!-- Canonical：SPA 单入口，可留空或由运行时设置 -->
    <!-- <link rel="canonical" href="..." /> -->

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Temio",
        "alternateName": "Temio 脑力训练平台",
        "description": "脑力与认知训练平台，提供 Stroop 测试、舒尔特方格等科学训练项目。",
        "inLanguage": "zh-Hans",
        "potentialAction": {
          "@type": "SearchAction",
          "target": { "@type": "EntryPoint", "urlTemplate": "/#games" },
          "query-input": "required name=query"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
